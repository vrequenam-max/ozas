<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZAS – Registro de Entregas</title>
<style>
  :root {
    --azul: #1a3a5c;
    --azul-medio: #2563a8;
    --azul-claro: #e8f0fa;
    --azul-borde: #b8d0f0;
    --verde: #16a34a;
    --verde-claro: #dcfce7;
    --amarillo: #ca8a04;
    --amarillo-claro: #fef9c3;
    --rojo: #dc2626;
    --rojo-claro: #fee2e2;
    --gris: #64748b;
    --gris-claro: #f1f5f9;
    --gris-borde: #e2e8f0;
    --blanco: #ffffff;
    --texto: #1e293b;
    --texto-sec: #475569;
    --radio: 8px;
    --radio-lg: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--gris-claro);
    color: var(--texto);
    font-size: 14px;
    line-height: 1.5;
  }

  /* HEADER */
  header {
    background: var(--azul);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  header .logo span { color: #7dd3fc; }
  header .subtitulo { font-size: 11px; color: #93c5fd; margin-top: 1px; }
  .nav-back {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    padding: 6px 12px;
    border-radius: var(--radio);
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  /* PROGRESO */
  .barra-progreso {
    background: var(--azul-medio);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    font-size: 12px;
  }
  .prog-track { flex: 1; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; }
  .prog-fill { height: 100%; background: #7dd3fc; border-radius: 3px; transition: width 0.4s; }

  /* CONTENEDOR */
  .container { max-width: 720px; margin: 0 auto; padding: 12px 12px 80px; }

  /* TARJETAS */
  .card {
    background: var(--blanco);
    border: 1px solid var(--gris-borde);
    border-radius: var(--radio-lg);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .card-header:hover { background: var(--gris-claro); }
  .card-body { padding: 0 16px 16px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--azul); display: flex; align-items: center; gap: 6px; }

  /* SECCIÓN ENCABEZADO DÍA */
  .seccion-dia {
    background: var(--azul);
    color: white;
    border-radius: var(--radio-lg);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .seccion-dia h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #bfdbfe; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* FORMULARIO */
  .campo { margin-bottom: 10px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--texto-sec); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px; }
  .seccion-dia label { color: #93c5fd; }
  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--gris-borde);
    border-radius: var(--radio);
    font-size: 13px;
    color: var(--texto);
    background: var(--blanco);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--azul-medio); box-shadow: 0 0 0 3px rgba(37,99,168,0.1); }
  .seccion-dia input, .seccion-dia select {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    color: white;
  }
  .seccion-dia input::placeholder { color: rgba(255,255,255,0.4); }
  .seccion-dia select option { color: var(--texto); background: white; }
  textarea { resize: vertical; min-height: 60px; }

  /* PARADAS */
  .parada-card {
    background: var(--blanco);
    border: 1.5px solid var(--gris-borde);
    border-radius: var(--radio-lg);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .parada-card.entregado { border-color: var(--verde); }
  .parada-card.parcial { border-color: var(--amarillo); }
  .parada-card.no-entregado { border-color: var(--rojo); }
  .parada-card.pendiente { border-color: var(--gris-borde); }

  .parada-header {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .parada-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--azul-claro);
    color: var(--azul);
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .parada-info { flex: 1; min-width: 0; }
  .parada-cliente { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .parada-sub { font-size: 11px; color: var(--texto-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .estado-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-pendiente { background: var(--gris-claro); color: var(--gris); }
  .badge-entregado { background: var(--verde-claro); color: var(--verde); }
  .badge-parcial { background: var(--amarillo-claro); color: var(--amarillo); }
  .badge-no-entregado { background: var(--rojo-claro); color: var(--rojo); }
  .badge-alerta { background: #fef3c7; color: #b45309; }

  .parada-body { padding: 4px 14px 14px; border-top: 1px solid var(--gris-borde); display: none; }
  .parada-body.abierto { display: block; }

  /* SECCIÓN INTERNA */
  .seccion-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--azul-medio);
    margin: 12px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--azul-borde);
  }

  /* PRODUCTOS */
  .producto-fila {
    display: grid;
    grid-template-columns: 1fr 70px 75px 60px 24px;
    gap: 5px;
    align-items: center;
    margin-bottom: 6px;
  }
  .producto-fila input, .producto-fila select { font-size: 12px; padding: 6px 8px; }
  .subtotal-display { font-size: 12px; font-weight: 600; color: var(--azul); text-align: right; }
  .btn-quitar { background: none; border: none; color: var(--rojo); cursor: pointer; font-size: 16px; padding: 0; line-height: 1; }

  /* CANJE BOX */
  .canje-box {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: var(--radio);
    padding: 8px 12px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #9a3412;
  }
  .canje-box input { width: 70px; font-size: 12px; padding: 4px 8px; flex-shrink: 0; }
  .canje-alerta { color: var(--rojo); font-weight: 600; font-size: 11px; margin-top: 3px; display: none; }

  /* PAGO */
  .pago-opciones { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .pago-btn {
    padding: 6px 12px;
    border: 1.5px solid var(--gris-borde);
    border-radius: 20px;
    background: white;
    font-size: 12px;
    cursor: pointer;
    color: var(--texto-sec);
    transition: all 0.15s;
    user-select: none;
  }
  .pago-btn.activo { border-color: var(--azul-medio); background: var(--azul-claro); color: var(--azul); font-weight: 600; }
  .pago-btn.influencer.activo { border-color: #a855f7; background: #f3e8ff; color: #7c3aed; }
  .credito-campo, .influencer-campo { display: none; }

  /* TOTALES */
  .totales-box {
    background: var(--gris-claro);
    border-radius: var(--radio);
    padding: 10px 12px;
    margin-top: 8px;
  }
  .total-fila { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-sec); padding: 2px 0; }
  .total-fila.principal { font-weight: 700; color: var(--texto); font-size: 14px; border-top: 1px solid var(--gris-borde); margin-top: 4px; padding-top: 6px; }
  .saldo-positivo { color: var(--rojo); }
  .saldo-cero { color: var(--verde); }

  /* BOTONES */
  .btn { padding: 9px 16px; border-radius: var(--radio); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primario { background: var(--azul); color: white; width: 100%; margin-top: 8px; }
  .btn-primario:hover { background: var(--azul-medio); }
  .btn-secundario { background: var(--gris-claro); color: var(--texto); border: 1px solid var(--gris-borde); }
  .btn-verde { background: var(--verde); color: white; width: 100%; margin-top: 8px; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-outline { background: none; border: 1.5px solid var(--azul); color: var(--azul); }

  /* MAPS */
  .btn-maps {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--azul-medio);
    text-decoration: none;
    padding: 4px 0;
  }

  /* RESUMEN FINAL */
  .resumen-panel {
    background: var(--azul);
    color: white;
    border-radius: var(--radio-lg);
    padding: 16px;
    margin-bottom: 10px;
  }
  .resumen-panel h3 { font-size: 14px; color: #bfdbfe; margin-bottom: 10px; }
  .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .resumen-item { background: rgba(255,255,255,0.08); border-radius: var(--radio); padding: 8px 10px; }
  .resumen-item .val { font-size: 20px; font-weight: 700; }
  .resumen-item .lbl { font-size: 10px; color: #93c5fd; }

  /* FAB AGREGAR */
  .fab {
    position: fixed;
    bottom: 20px;
    right: 16px;
    background: var(--azul);
    color: white;
    border: none;
    border-radius: 28px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(26,58,92,0.35);
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 50;
  }
  .fab:hover { background: var(--azul-medio); }

  /* TABS */
  .tabs { display: flex; gap: 0; margin-bottom: 12px; background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio); overflow: hidden; }
  .tab { flex: 1; padding: 9px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: none; color: var(--texto-sec); transition: all 0.15s; }
  .tab.activo { background: var(--azul); color: white; }

  /* HORA BTNS */
  .hora-grupo { display: flex; gap: 5px; align-items: center; }
  .hora-grupo input { flex: 1; }
  .btn-ahora { font-size: 10px; padding: 5px 8px; white-space: nowrap; }

  /* FOTO */
  .foto-preview { width: 100%; max-height: 120px; object-fit: cover; border-radius: var(--radio); margin-top: 6px; display: none; }

  /* ALERTA */
  .alerta { background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--radio); padding: 8px 10px; font-size: 12px; color: #9a3412; margin-bottom: 8px; }
  .alerta.info { background: var(--azul-claro); border-color: var(--azul-borde); color: var(--azul); }

  .chevron { transition: transform 0.2s; font-size: 12px; color: var(--gris); }
  .chevron.abierto { transform: rotate(180deg); }

  @media(max-width:480px) {
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .producto-fila { grid-template-columns: 1fr 60px 65px 50px 20px; gap: 4px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">OZ<span>AS</span></div>
    <div class="subtitulo">Registro de Entregas</div>
  </div>
  <a href="ozas-sistema-gestion.html" class="nav-back">← Sistema</a>
</header>

<div class="barra-progreso">
  <span id="txt-progreso">0 de 0 paradas</span>
  <div class="prog-track"><div class="prog-fill" id="barra-fill" style="width:0%"></div></div>
  <span id="txt-fecha-hdr" style="font-size:11px;opacity:0.7"></span>
</div>

<div class="container">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab activo" onclick="showTab('paradas',this)">📦 Paradas</button>
    <button class="tab" onclick="showTab('encabezado',this)">📋 Encabezado</button>
    <button class="tab" onclick="showTab('resumen',this)">📊 Resumen</button>
  </div>

  <!-- TAB ENCABEZADO -->
  <div id="tab-encabezado" style="display:none">
    <div class="seccion-dia">
      <h2>📋 Datos del día</h2>
      <div class="grid-2">
        <div class="campo">
          <label>Fecha</label>
          <input type="date" id="fecha-dia">
        </div>
        <div class="campo">
          <label>Asesor comercial</label>
          <select id="asesor-dia">
            <option value="">Seleccionar</option>
            <option>Christian</option>
            <option>Rosita</option>
            <option>Gianni</option>
            <option>Nery</option>
            <option>Varios</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="campo">
          <label>Conductor</label>
          <input type="text" id="conductor" placeholder="Nombre del conductor">
        </div>
        <div class="campo">
          <label>Despachador</label>
          <input type="text" id="despachador" placeholder="Nombre del despachador">
        </div>
      </div>
      <div class="campo">
        <label>Observaciones generales</label>
        <textarea id="obs-dia" placeholder="Notas del día, incidencias, instrucciones..." style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:white;" rows="2"></textarea>
      </div>
    </div>
    <button class="btn btn-primario" onclick="guardarEncabezado()">Guardar encabezado del día</button>
  </div>

  <!-- TAB PARADAS -->
  <div id="tab-paradas">
    <div id="lista-paradas"></div>
    <div style="text-align:center;padding:20px;color:var(--texto-sec);font-size:13px" id="empty-msg" style="display:none">
      Usa el botón + para agregar la primera parada
    </div>
  </div>

  <!-- TAB RESUMEN -->
  <div id="tab-resumen" style="display:none">
    <div class="resumen-panel">
      <h3>Resumen del día</h3>
      <div class="resumen-grid" id="resumen-grid"></div>
    </div>
    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="card-title">💰 Cobros por método de pago</span>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body" id="resumen-cobros"></div>
    </div>
    <div class="card">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="card-title">📦 Bidones y canjes</span>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body" id="resumen-bidones"></div>
    </div>
    <button class="btn btn-primario" onclick="exportarWhatsApp()">📱 Exportar para WhatsApp</button>
    <button class="btn btn-primario" style="background:var(--verde);margin-top:6px" onclick="enviarSheets()">📊 Enviar a Google Sheets</button>
  </div>

</div>

<!-- FAB -->
<button class="fab" onclick="agregarParada()">
  <span style="font-size:18px">+</span> Parada
</button>

<script>
// ======= CONFIGURACIÓN =======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKaR-y9FESCqsQDeQLu9anogxD2GA8-lTXYvYLcww0qxZvzqqB2hV4WN3xds1C1MI9-Q/exec'; // Reemplazar con tu URL de Apps Script
const ASESORES = ['Christian','Rosita','Gianni','Nery','Otro'];
const PRODUCTOS_CATALOGO = [
  'Bidón 20L con caño — NUEVO',
  'Bidón 20L sin caño — NUEVO',
  'Recarga bidón 20L con caño (CANJE)',
  'Recarga bidón 20L sin caño (CANJE)',
  'Caja 20L',
  'Pack 12 Botellas 1L tapa sport',
  'Pack 15 Botellas 625ml + gratis',
  'Botella 8.7L',
  'Otro'
];
const PRECIOS_BASE = {
  'Bidón 20L con caño — NUEVO': 30,
  'Bidón 20L sin caño — NUEVO': 18,
  'Recarga bidón 20L con caño (CANJE)': 18,
  'Recarga bidón 20L sin caño (CANJE)': 18,
  'Caja 20L': 21.90,
  'Pack 12 Botellas 1L tapa sport': 19,
  'Pack 15 Botellas 625ml + gratis': 12,
  'Botella 8.7L': 5,
  'Otro': 0
};

// ======= ESTADO =======
let paradas = [];
let paradaIdCounter = 0;

// ======= INIT =======
document.addEventListener('DOMContentLoaded', () => {
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('fecha-dia').value = hoy;
  document.getElementById('txt-fecha-hdr').textContent = formatFecha(hoy);
  cargarLocalStorage();
  renderParadas();
  actualizarProgreso();
});

function formatFecha(iso) {
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${meses[parseInt(m)-1]} ${y}`;
}

// ======= TABS =======
function showTab(nombre, btn) {
  ['paradas','encabezado','resumen'].forEach(t => {
    document.getElementById('tab-'+t).style.display = 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('activo'));
  document.getElementById('tab-'+nombre).style.display = 'block';
  btn.classList.add('activo');
  document.querySelector('.fab').style.display = nombre === 'paradas' ? 'flex' : 'none';
  if (nombre === 'resumen') calcularResumen();
}

// ======= PARADAS =======
function agregarParada(datos) {
  const id = ++paradaIdCounter;
  const parada = datos || {
    id,
    cliente: '',
    distrito: '',
    direccion: '',
    telefono: '',
    documento: '',
    comprobante: 'Ninguno',
    asesor: '',
    productos: [{ tipo: '', cantidad: 1, precio: 0 }],
    bidonesRecogidos: [],
    formaPago: [],
    diasCredito: 30,
    notaInfluencer: '',
    montoCobrado: 0,
    horaEstimada: '',
    horaLlegada: '',
    horaSalida: '',
    estado: 'pendiente',
    observaciones: '',
    confirmado: false,
    quienRecibe: ''
  };
  if (!datos) parada.id = id;
  paradas.push(parada);
  guardarLocalStorage();
  renderParadas();
  actualizarProgreso();
  // Abrir la nueva parada
  setTimeout(() => {
    const el = document.getElementById('body-'+parada.id);
    if (el) { el.classList.add('abierto'); document.getElementById('chev-'+parada.id).classList.add('abierto'); }
    document.getElementById('cli-'+parada.id).focus();
  }, 50);
}

function renderParadas() {
  const cont = document.getElementById('lista-paradas');
  if (paradas.length === 0) {
    cont.innerHTML = '<div style="text-align:center;padding:30px;color:var(--texto-sec);font-size:13px">Usa el botón + para agregar paradas</div>';
    return;
  }
  cont.innerHTML = paradas.map((p, idx) => renderParada(p, idx+1)).join('');
  // Restaurar eventos
  paradas.forEach(p => { bindParada(p); });
}

function renderParada(p, num) {
  const totalPedido = calcTotalPedido(p);
  const saldo = totalPedido - (parseFloat(p.montoCobrado)||0);
  const esInfluencer = p.formaPago.includes('Influencer');

  const estadoClass = { pendiente: 'badge-pendiente', entregado: 'badge-entregado', parcial: 'badge-parcial', 'no-entregado': 'badge-no-entregado' };
  const estadoLabel = { pendiente: 'Pendiente', entregado: '✓ Entregado', parcial: '~ Parcial', 'no-entregado': '✗ No entregado' };

  const alertas = [];
  if (!p.cliente) alertas.push('Sin cliente');
  p.productos.forEach((pr, i) => {
    if (esCanje(pr.tipo)) {
      const recog = parseInt(p.bidonesRecogidos[i])||0;
      if (recog !== parseInt(pr.cantidad)) alertas.push('Verificar canje');
    }
  });

  return `<div class="parada-card ${p.estado}" id="card-${p.id}">
    <div class="parada-header" onclick="toggleParada(${p.id})">
      <div class="parada-num">${num}</div>
      <div class="parada-info">
        <div class="parada-cliente">${p.cliente || 'Nuevo cliente...'}</div>
        <div class="parada-sub">${p.distrito || ''}${p.distrito && p.horaEstimada ? ' · ' : ''}${p.horaEstimada ? '🕐 '+p.horaEstimada : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
        <span class="estado-badge ${estadoClass[p.estado]}">${estadoLabel[p.estado]}</span>
        ${alertas.length ? '<span class="estado-badge badge-alerta">⚠ '+alertas[0]+'</span>' : ''}
      </div>
      <span class="chevron" id="chev-${p.id}">▼</span>
    </div>

    <div class="parada-body" id="body-${p.id}">

      <!-- CLIENTE -->
      <div class="seccion-label">Cliente</div>
      <div class="grid-2">
        <div class="campo">
          <label>Nombre cliente *</label>
          <input type="text" id="cli-${p.id}" value="${p.cliente}" placeholder="Nombre o empresa" oninput="updateField(${p.id},'cliente',this.value)">
        </div>
        <div class="campo">
          <label>Asesor comercial</label>
          <select onchange="updateField(${p.id},'asesor',this.value)">
            <option value="">Seleccionar</option>
            ${ASESORES.map(a=>`<option ${p.asesor===a?'selected':''}>${a}</option>`).join('')}
          </select>
        </div>
        <div class="campo">
          <label>Distrito</label>
          <input type="text" value="${p.distrito}" placeholder="Ej: Miraflores" oninput="updateField(${p.id},'distrito',this.value)">
        </div>
        <div class="campo">
          <label>Teléfono</label>
          <input type="tel" value="${p.telefono}" placeholder="9XXXXXXXX" oninput="updateField(${p.id},'telefono',this.value)">
        </div>
      </div>
      <div class="campo">
        <label>Dirección</label>
        <input type="text" value="${p.direccion}" placeholder="Calle, número, referencia" oninput="updateField(${p.id},'direccion',this.value)" id="dir-${p.id}">
        ${p.direccion ? `<a class="btn-maps" href="https://maps.google.com?q=${encodeURIComponent(p.direccion+' '+p.distrito+' Lima')}" target="_blank">📍 Abrir en Maps</a>` : ''}
      </div>
      <div class="grid-2">
        <div class="campo">
          <label>RUC / DNI</label>
          <input type="text" value="${p.documento}" placeholder="RUC o DNI" oninput="updateField(${p.id},'documento',this.value)">
        </div>
        <div class="campo">
          <label>Comprobante</label>
          <select onchange="updateField(${p.id},'comprobante',this.value)">
            ${['Ninguno','Factura','Boleta','Boleta Digital','Guía de Remisión'].map(c=>`<option ${p.comprobante===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>

      <!-- PRODUCTOS -->
      <div class="seccion-label">Productos despachados</div>
      <div style="font-size:10px;color:var(--texto-sec);margin-bottom:6px;display:grid;grid-template-columns:1fr 70px 75px 60px 24px;gap:5px">
        <span>Producto</span><span>Cant.</span><span>P.Unit S/</span><span>Total</span><span></span>
      </div>
      <div id="prods-${p.id}">
        ${p.productos.map((pr,i) => renderProducto(p.id, pr, i)).join('')}
      </div>
      <button class="btn btn-secundario btn-sm" onclick="addProducto(${p.id})" style="margin-top:4px">+ Producto</button>

      <!-- CANJE RESUMEN -->
      <div id="canje-resumen-${p.id}"></div>

      <!-- PAGO -->
      <div class="seccion-label">Pago</div>
      <div class="pago-opciones" id="pago-opts-${p.id}">
        ${['Efectivo','Yape','Plin','Transferencia','Crédito','Influencer','Por confirmar'].map(m=>`
          <button class="pago-btn${m==='Influencer'?' influencer':''}${p.formaPago.includes(m)?' activo':''}" onclick="togglePago(${p.id},'${m}',this)">${m}</button>
        `).join('')}
      </div>
      <div id="credito-campo-${p.id}" class="campo" style="display:${p.formaPago.includes('Crédito')?'block':'none'}">
        <label>Días de crédito</label>
        <select onchange="updateField(${p.id},'diasCredito',this.value)">
          ${[15,30,45,60].map(d=>`<option ${p.diasCredito==d?'selected':''}>${d} días</option>`).join('')}
          <option ${![15,30,45,60].includes(parseInt(p.diasCredito))?'selected':''}>Otro</option>
        </select>
      </div>
      <div id="influencer-campo-${p.id}" class="campo" style="display:${p.formaPago.includes('Influencer')?'block':'none'}">
        <label>Nota de cortesía *</label>
        <input type="text" value="${p.notaInfluencer}" placeholder="Motivo de la cortesía (requerido)" oninput="updateField(${p.id},'notaInfluencer',this.value)">
      </div>
      <div class="totales-box">
        <div class="total-fila"><span>Total pedido</span><span>S/ ${totalPedido.toFixed(2)}</span></div>
        ${esInfluencer ? '<div class="total-fila" style="color:#7c3aed"><span>Influencer / Cortesía</span><span>S/ 0.00</span></div>' : ''}
        <div class="total-fila">
          <span>Monto cobrado</span>
          <span><input type="number" value="${p.montoCobrado}" min="0" step="0.1" style="width:80px;text-align:right;padding:3px 6px;font-size:12px" oninput="updateMonto(${p.id},this.value)"></span>
        </div>
        <div class="total-fila principal">
          <span>Saldo</span>
          <span class="${saldo<=0.01?'saldo-cero':'saldo-positivo'}">S/ ${Math.max(0,saldo).toFixed(2)}</span>
        </div>
      </div>

      <!-- LOGÍSTICA -->
      <div class="seccion-label">Logística y tiempo</div>
      <div class="grid-3">
        <div class="campo">
          <label>Hora estimada</label>
          <div class="hora-grupo">
            <input type="time" value="${p.horaEstimada}" onchange="updateField(${p.id},'horaEstimada',this.value)">
          </div>
        </div>
        <div class="campo">
          <label>Hora llegada</label>
          <div class="hora-grupo">
            <input type="time" value="${p.horaLlegada}" id="llegada-${p.id}" onchange="updateField(${p.id},'horaLlegada',this.value)">
            <button class="btn btn-secundario btn-ahora" onclick="setAhora('llegada-${p.id}',${p.id},'horaLlegada')">Ahora</button>
          </div>
        </div>
        <div class="campo">
          <label>Hora salida</label>
          <div class="hora-grupo">
            <input type="time" value="${p.horaSalida}" id="salida-${p.id}" onchange="updateField(${p.id},'horaSalida',this.value)">
            <button class="btn btn-secundario btn-ahora" onclick="setAhora('salida-${p.id}',${p.id},'horaSalida')">Ahora</button>
          </div>
        </div>
      </div>
      <div class="campo">
        <label>Estado de entrega</label>
        <select onchange="updateEstado(${p.id},this.value)">
          ${[['pendiente','Pendiente'],['entregado','Entregado'],['parcial','Entregado parcial'],['no-entregado','No encontrado / Reprogramar']].map(([v,l])=>`<option value="${v}" ${p.estado===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="campo">
        <label>Observaciones de parada</label>
        <textarea rows="2" placeholder="Instrucciones especiales, incidencias..." oninput="updateField(${p.id},'observaciones',this.value)">${p.observaciones}</textarea>
      </div>

      <!-- CONFIRMACIÓN -->
      <div class="seccion-label">Confirmación</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <input type="checkbox" id="conf-${p.id}" ${p.confirmado?'checked':''} onchange="updateField(${p.id},'confirmado',this.checked)" style="width:auto;width:16px;height:16px">
        <label for="conf-${p.id}" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--texto)">Cliente recibió conforme</label>
      </div>
      <div class="campo">
        <label>Nombre de quien recibe</label>
        <input type="text" value="${p.quienRecibe}" placeholder="Opcional" oninput="updateField(${p.id},'quienRecibe',this.value)">
      </div>

      <!-- ACCIONES -->
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-secundario btn-sm" style="flex:1;color:var(--rojo);border-color:var(--rojo)" onclick="eliminarParada(${p.id})">🗑 Eliminar</button>
        <button class="btn btn-primario btn-sm" style="flex:1;margin-top:0" onclick="guardarParada(${p.id})">💾 Guardar</button>
      </div>

    </div>
  </div>`;
}

function renderProducto(paradaId, pr, idx) {
  return `<div class="producto-fila" id="prod-fila-${paradaId}-${idx}">
    <select onchange="onTipoChange(${paradaId},${idx},this.value)" style="font-size:11px">
      <option value="">Tipo...</option>
      ${PRODUCTOS_CATALOGO.map(p=>`<option ${pr.tipo===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <input type="number" min="1" value="${pr.cantidad||1}" placeholder="Cant" oninput="onCantChange(${paradaId},${idx},this.value)">
    <input type="number" min="0" step="0.1" value="${pr.precio||0}" placeholder="S/" oninput="onPrecioChange(${paradaId},${idx},this.value)">
    <div class="subtotal-display">S/${((pr.cantidad||0)*(pr.precio||0)).toFixed(1)}</div>
    <button class="btn-quitar" onclick="quitarProducto(${paradaId},${idx})">×</button>
  </div>
  ${esCanje(pr.tipo) ? `
    <div class="canje-box">
      <span>♻ Bidones vacíos a recoger:</span>
      <input type="number" min="0" value="${getBidonRecogido(paradaId,idx)}" onchange="onCanjeChange(${paradaId},${idx},this.value)" placeholder="0">
      <div class="canje-alerta" id="alerta-canje-${paradaId}-${idx}">⚠ Diferencia en canje</div>
    </div>` : ''}`;
}

function esCanje(tipo) { return tipo && tipo.includes('CANJE'); }

function getBidonRecogido(paradaId, idx) {
  const p = getParada(paradaId);
  return p ? (p.bidonesRecogidos[idx]||0) : 0;
}

function bindParada(p) {
  // Los eventos inline ya están vinculados en el HTML
  renderCanjeResumen(p.id);
}

function renderCanjeResumen(paradaId) {
  const p = getParada(paradaId);
  if (!p) return;
  const box = document.getElementById('canje-resumen-'+paradaId);
  if (!box) return;
  const canjes = p.productos.filter(pr => esCanje(pr.tipo));
  if (canjes.length === 0) { box.innerHTML=''; return; }
  const totalDespacho = canjes.reduce((s,pr)=>s+(parseInt(pr.cantidad)||0),0);
  const totalRecogido = p.bidonesRecogidos.reduce((s,v)=>s+(parseInt(v)||0),0);
  const ok = totalDespacho === totalRecogido;
  box.innerHTML = `<div class="alerta ${ok?'info':''}">
    ${ok ? '✓' : '⚠'} Canje: despachar <strong>${totalDespacho}</strong> bidón(es) lleno(s) / recoger <strong>${totalDespacho}</strong> vacío(s) — registrado: <strong>${totalRecogido}</strong>
    ${!ok ? ' · <strong style="color:var(--rojo)">Verificar cantidad</strong>' : ''}
  </div>`;
}

// ======= EVENTOS =======
function toggleParada(id) {
  const body = document.getElementById('body-'+id);
  const chev = document.getElementById('chev-'+id);
  body.classList.toggle('abierto');
  chev.classList.toggle('abierto');
}

function updateField(id, campo, valor) {
  const p = getParada(id);
  if (!p) return;
  p[campo] = valor;
  guardarLocalStorage();
  if (campo === 'cliente' || campo === 'distrito' || campo === 'horaEstimada') {
    const card = document.getElementById('card-'+id);
    if (card) {
      card.querySelector('.parada-cliente').textContent = p.cliente || 'Nuevo cliente...';
      card.querySelector('.parada-sub').textContent = (p.distrito||'') + (p.distrito&&p.horaEstimada?' · ':'') + (p.horaEstimada?'🕐 '+p.horaEstimada:'');
    }
  }
}

function onTipoChange(paradaId, idx, valor) {
  const p = getParada(paradaId);
  if (!p) return;
  p.productos[idx].tipo = valor;
  if (PRECIOS_BASE[valor] !== undefined) p.productos[idx].precio = PRECIOS_BASE[valor];
  guardarLocalStorage();
  // Re-render solo productos y canje
  document.getElementById('prods-'+paradaId).innerHTML = p.productos.map((pr,i)=>renderProducto(paradaId,pr,i)).join('');
  renderCanjeResumen(paradaId);
  actualizarTotalesUI(paradaId);
}

function onCantChange(paradaId, idx, val) {
  const p = getParada(paradaId);
  if (!p) return;
  p.productos[idx].cantidad = parseInt(val)||0;
  guardarLocalStorage();
  actualizarSubtotalUI(paradaId, idx);
  actualizarTotalesUI(paradaId);
  renderCanjeResumen(paradaId);
}

function onPrecioChange(paradaId, idx, val) {
  const p = getParada(paradaId);
  if (!p) return;
  p.productos[idx].precio = parseFloat(val)||0;
  guardarLocalStorage();
  actualizarSubtotalUI(paradaId, idx);
  actualizarTotalesUI(paradaId);
}

function onCanjeChange(paradaId, idx, val) {
  const p = getParada(paradaId);
  if (!p) return;
  if (!p.bidonesRecogidos) p.bidonesRecogidos = [];
  p.bidonesRecogidos[idx] = parseInt(val)||0;
  guardarLocalStorage();
  renderCanjeResumen(paradaId);
}

function actualizarSubtotalUI(paradaId, idx) {
  const p = getParada(paradaId);
  if (!p) return;
  const pr = p.productos[idx];
  const fila = document.getElementById('prod-fila-'+paradaId+'-'+idx);
  if (fila) {
    const disp = fila.querySelector('.subtotal-display');
    if (disp) disp.textContent = 'S/'+(((pr.cantidad||0)*(pr.precio||0)).toFixed(1));
  }
}

function actualizarTotalesUI(paradaId) {
  // Buscar y actualizar totales en la card sin re-render completo
}

function addProducto(paradaId) {
  const p = getParada(paradaId);
  if (!p) return;
  p.productos.push({ tipo:'', cantidad:1, precio:0 });
  guardarLocalStorage();
  document.getElementById('prods-'+paradaId).innerHTML = p.productos.map((pr,i)=>renderProducto(paradaId,pr,i)).join('');
}

function quitarProducto(paradaId, idx) {
  const p = getParada(paradaId);
  if (!p || p.productos.length <= 1) return;
  p.productos.splice(idx, 1);
  if (p.bidonesRecogidos) p.bidonesRecogidos.splice(idx, 1);
  guardarLocalStorage();
  document.getElementById('prods-'+paradaId).innerHTML = p.productos.map((pr,i)=>renderProducto(paradaId,pr,i)).join('');
  renderCanjeResumen(paradaId);
}

function togglePago(paradaId, metodo, btn) {
  const p = getParada(paradaId);
  if (!p) return;
  const idx = p.formaPago.indexOf(metodo);
  if (idx >= 0) p.formaPago.splice(idx,1);
  else p.formaPago.push(metodo);
  btn.classList.toggle('activo');
  document.getElementById('credito-campo-'+paradaId).style.display = p.formaPago.includes('Crédito')?'block':'none';
  document.getElementById('influencer-campo-'+paradaId).style.display = p.formaPago.includes('Influencer')?'block':'none';
  guardarLocalStorage();
}

function updateMonto(paradaId, val) {
  const p = getParada(paradaId);
  if (!p) return;
  p.montoCobrado = parseFloat(val)||0;
  guardarLocalStorage();
}

function updateEstado(paradaId, estado) {
  const p = getParada(paradaId);
  if (!p) return;
  p.estado = estado;
  const card = document.getElementById('card-'+paradaId);
  if (card) {
    card.className = 'parada-card ' + estado;
    const estadoLabel = { pendiente: 'Pendiente', entregado: '✓ Entregado', parcial: '~ Parcial', 'no-entregado': '✗ No entregado' };
    const estadoClass = { pendiente: 'badge-pendiente', entregado: 'badge-entregado', parcial: 'badge-parcial', 'no-entregado': 'badge-no-entregado' };
    const badge = card.querySelector('.estado-badge');
    if (badge) { badge.className = 'estado-badge '+estadoClass[estado]; badge.textContent = estadoLabel[estado]; }
  }
  guardarLocalStorage();
  actualizarProgreso();
}

function setAhora(inputId, paradaId, campo) {
  const ahora = new Date();
  const h = String(ahora.getHours()).padStart(2,'0');
  const m = String(ahora.getMinutes()).padStart(2,'0');
  const val = h+':'+m;
  document.getElementById(inputId).value = val;
  updateField(paradaId, campo, val);
}

function guardarParada(id) {
  guardarLocalStorage();
  renderParadas();
  actualizarProgreso();
}

function eliminarParada(id) {
  if (!confirm('¿Eliminar esta parada?')) return;
  paradas = paradas.filter(p => p.id !== id);
  guardarLocalStorage();
  renderParadas();
  actualizarProgreso();
}

function toggleCard(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  const visible = body.style.display !== 'none';
  body.style.display = visible ? 'none' : 'block';
  if (chev) chev.classList.toggle('abierto', !visible);
}

// ======= UTILIDADES =======
function getParada(id) { return paradas.find(p => p.id === id); }

function calcTotalPedido(p) {
  if (p.formaPago.includes('Influencer')) return 0;
  return p.productos.reduce((s,pr)=>s+(parseFloat(pr.cantidad)||0)*(parseFloat(pr.precio)||0), 0);
}

function actualizarProgreso() {
  const total = paradas.length;
  const entregados = paradas.filter(p => p.estado === 'entregado' || p.estado === 'parcial').length;
  const pct = total > 0 ? Math.round(entregados/total*100) : 0;
  document.getElementById('txt-progreso').textContent = `${entregados} de ${total} paradas`;
  document.getElementById('barra-fill').style.width = pct+'%';
  const fecha = document.getElementById('fecha-dia').value;
  document.getElementById('txt-fecha-hdr').textContent = fecha ? formatFecha(fecha) : '';
}

// ======= RESUMEN =======
function calcularResumen() {
  let bidonesNuevos = 0, bidonesRecarga = 0, bidonesRecogidos = 0;
  let cajas = 0, botellas1L = 0, botellas625 = 0, botellas87 = 0;
  let cobros = { Efectivo:0, Yape:0, Plin:0, Transferencia:0, Crédito:0, Influencer:0, 'Por confirmar':0 };
  let totalCobrado = 0, totalPedido = 0, totalCredito = 0;

  paradas.forEach(p => {
    p.productos.forEach((pr, i) => {
      const cant = parseInt(pr.cantidad)||0;
      if (pr.tipo.includes('NUEVO')) bidonesNuevos += cant;
      else if (pr.tipo.includes('CANJE')) { bidonesRecarga += cant; bidonesRecogidos += parseInt(p.bidonesRecogidos[i])||0; }
      else if (pr.tipo.includes('Caja')) cajas += cant;
      else if (pr.tipo.includes('1L')) botellas1L += cant;
      else if (pr.tipo.includes('625')) botellas625 += cant;
      else if (pr.tipo.includes('8.7')) botellas87 += cant;
    });
    const tot = calcTotalPedido(p);
    totalPedido += tot;
    const cobrado = parseFloat(p.montoCobrado)||0;
    totalCobrado += cobrado;
    if (p.formaPago.includes('Crédito')) totalCredito += (tot - cobrado);
    p.formaPago.forEach(m => { if (cobros[m] !== undefined) cobros[m] += cobrado; });
  });

  document.getElementById('resumen-grid').innerHTML = `
    <div class="resumen-item"><div class="val">${paradas.length}</div><div class="lbl">Paradas totales</div></div>
    <div class="resumen-item"><div class="val">${paradas.filter(p=>p.estado==='entregado').length}</div><div class="lbl">Entregadas</div></div>
    <div class="resumen-item"><div class="val">S/ ${totalCobrado.toFixed(2)}</div><div class="lbl">Total cobrado</div></div>
    <div class="resumen-item"><div class="val">S/ ${Math.max(0,totalPedido-totalCobrado).toFixed(2)}</div><div class="lbl">Saldo pendiente</div></div>
  `;

  document.getElementById('resumen-cobros').innerHTML = Object.entries(cobros)
    .filter(([,v])=>v>0)
    .map(([m,v])=>`<div class="total-fila"><span>${m}</span><span>S/ ${v.toFixed(2)}</span></div>`)
    .join('') || '<p style="color:var(--texto-sec);font-size:13px">Sin cobros registrados</p>';

  document.getElementById('resumen-bidones').innerHTML = `
    <div class="total-fila"><span>Bidones nuevos despachados</span><span>${bidonesNuevos}</span></div>
    <div class="total-fila"><span>Bidones en recarga (despachados)</span><span>${bidonesRecarga}</span></div>
    <div class="total-fila"><span>Bidones vacíos recogidos</span><span>${bidonesRecogidos}</span></div>
    <div class="total-fila"><span>Cajas 20L</span><span>${cajas}</span></div>
    <div class="total-fila"><span>Packs 1L</span><span>${botellas1L}</span></div>
    <div class="total-fila"><span>Packs 625ml</span><span>${botellas625}</span></div>
    <div class="total-fila"><span>Botellas 8.7L</span><span>${botellas87}</span></div>
  `;
}

// ======= ENCABEZADO =======
function guardarEncabezado() {
  guardarLocalStorage();
  actualizarProgreso();
  alert('Encabezado guardado ✓');
}

// ======= EXPORT =======
function exportarWhatsApp() {
  const fecha = document.getElementById('fecha-dia').value;
  const conductor = document.getElementById('conductor').value;
  const despachador = document.getElementById('despachador').value;
  let txt = `🚚 *OZAS – Resumen Entregas ${fecha ? formatFecha(fecha) : ''}*\n`;
  txt += conductor ? `Conductor: ${conductor}\n` : '';
  txt += despachador ? `Despachador: ${despachador}\n` : '';
  txt += `\n*PARADAS (${paradas.length}):*\n`;
  paradas.forEach((p,i) => {
    const total = calcTotalPedido(p);
    const estado = { pendiente:'⏳', entregado:'✅', parcial:'🟡', 'no-entregado':'❌' };
    txt += `\n${estado[p.estado]||'⏳'} *${i+1}. ${p.cliente||'S/N'}* — ${p.distrito||''}\n`;
    txt += `   ${p.direccion||''}\n`;
    p.productos.forEach(pr => {
      if (pr.tipo) txt += `   • ${pr.tipo.replace(' — NUEVO','').replace(' (CANJE)','')}: ${pr.cantidad} x S/${pr.precio} = S/${(pr.cantidad*pr.precio).toFixed(2)}\n`;
    });
    const canjes = p.productos.filter(pr=>esCanje(pr.tipo));
    if (canjes.length) txt += `   ♻ Bidones recogidos: ${p.bidonesRecogidos.reduce((s,v)=>s+(parseInt(v)||0),0)}\n`;
    txt += `   💰 ${p.formaPago.join('+')||'—'}: S/${(parseFloat(p.montoCobrado)||0).toFixed(2)} / S/${total.toFixed(2)}\n`;
  });
  // Totales
  const totCobrado = paradas.reduce((s,p)=>s+(parseFloat(p.montoCobrado)||0),0);
  const totPedido = paradas.reduce((s,p)=>s+calcTotalPedido(p),0);
  txt += `\n*TOTAL: S/${totCobrado.toFixed(2)} cobrado / S/${totPedido.toFixed(2)} pedido*`;
  if (navigator.share) {
    navigator.share({ text: txt, title: 'OZAS Entregas' });
  } else {
    navigator.clipboard.writeText(txt).then(()=>alert('Resumen copiado al portapapeles ✓')).catch(()=>{
      prompt('Copia este texto:', txt);
    });
  }
}

function enviarSheets() {
  if (APPS_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbzKaR-y9FESCqsQDeQLu9anogxD2GA8-lTXYvYLcww0qxZvzqqB2hV4WN3xds1C1MI9-Q/exec') {
    alert('⚠ Configura la URL de Apps Script en el código (variable APPS_SCRIPT_URL)');
    return;
  }
  const fecha = document.getElementById('fecha-dia').value;
  const conductor = document.getElementById('conductor').value;
  const despachador = document.getElementById('despachador').value;
  const asesorDia = document.getElementById('asesor-dia').value;
  const filas = [];
  paradas.forEach(p => {
    p.productos.forEach((pr, i) => {
      filas.push({
        fecha, conductor, despachador, asesorDia,
        asesorPedido: p.asesor,
        cliente: p.cliente, distrito: p.distrito, direccion: p.direccion,
        telefono: p.telefono, documento: p.documento, comprobante: p.comprobante,
        producto: pr.tipo, cantidad: pr.cantidad, precioUnit: pr.precio,
        totalProducto: (pr.cantidad||0)*(pr.precio||0),
        esCanje: esCanje(pr.tipo)?'Sí':'No',
        bidonesRecogidos: esCanje(pr.tipo)?(p.bidonesRecogidos[i]||0):'',
        formaPago: p.formaPago.join(','),
        diasCredito: p.formaPago.includes('Crédito')?p.diasCredito:'',
        notaInfluencer: p.formaPago.includes('Influencer')?p.notaInfluencer:'',
        montoCobrado: p.montoCobrado,
        totalPedido: calcTotalPedido(p),
        horaEstimada: p.horaEstimada, horaLlegada: p.horaLlegada, horaSalida: p.horaSalida,
        estado: p.estado, observaciones: p.observaciones,
        confirmado: p.confirmado?'Sí':'No', quienRecibe: p.quienRecibe
      });
    });
  });
  fetch(APPS_SCRIPT_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ accion:'registrarEntregas', filas })
  }).then(()=>alert('Datos enviados a Google Sheets ✓')).catch(()=>alert('Error al enviar. Verifica la URL de Apps Script.'));
}

// ======= LOCAL STORAGE =======
function guardarLocalStorage() {
  const estado = {
    fecha: document.getElementById('fecha-dia').value,
    conductor: document.getElementById('conductor').value,
    despachador: document.getElementById('despachador').value,
    asesorDia: document.getElementById('asesor-dia').value,
    obsDia: document.getElementById('obs-dia').value,
    paradas, paradaIdCounter
  };
  localStorage.setItem('ozas_entregas', JSON.stringify(estado));
}

function cargarLocalStorage() {
  try {
    const raw = localStorage.getItem('ozas_entregas');
    if (!raw) return;
    const estado = JSON.parse(raw);
    if (estado.fecha) document.getElementById('fecha-dia').value = estado.fecha;
    if (estado.conductor) document.getElementById('conductor').value = estado.conductor;
    if (estado.despachador) document.getElementById('despachador').value = estado.despachador;
    if (estado.asesorDia) document.getElementById('asesor-dia').value = estado.asesorDia;
    if (estado.obsDia) document.getElementById('obs-dia').value = estado.obsDia;
    if (estado.paradas) paradas = estado.paradas;
    if (estado.paradaIdCounter) paradaIdCounter = estado.paradaIdCounter;
  } catch(e) { console.error('Error cargando estado:', e); }
}
